name: harvest

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "single site to run (empty = all)"
        required: false
        default: ""
      budget:
        description: "minutes of harvesting"
        required: false
        default: "300"

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        site: [galaxynovels, fanmtl, wuxiaworldsite]
    steps:
      - uses: actions/checkout@v4

      - name: install rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone about gdrive: --bind 0.0.0.0 | head -3

      - name: harvest
        env:
          RCLONE_REMOTE: gdrive
        run: |
          if [ -n "${{ github.event.inputs.site }}" ] && [ "${{ github.event.inputs.site }}" != "${{ matrix.site }}" ]; then
            echo "skipping ${{ matrix.site }}"; exit 0
          fi
          PYTHONPATH=harvest python3 harvest/runner.py --site "${{ matrix.site }}" --budget-min "${{ github.event.inputs.budget || '300' }}"
