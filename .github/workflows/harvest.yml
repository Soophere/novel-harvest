name: harvest

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "site name, or empty for all"
        required: false
        default: ""
      budget:
        description: "minutes of harvesting"
        required: false
        default: "330"

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: galaxynovels, shard: 0 }
          - { site: galaxynovels, shard: 1 }
          - { site: fanmtl, shard: 0 }
          - { site: fanmtl, shard: 1 }
          - { site: wuxiaworldsite, shard: 0 }
          - { site: wuxiaworldsite, shard: 1 }
    steps:
      - uses: actions/checkout@v4

      - name: install rclone
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone lsd gdrive: --bind 0.0.0.0 | head -3

      - name: harvest
        env:
          RCLONE_REMOTE: gdrive
          SITE: ${{ matrix.site }}
          SHARD: ${{ matrix.shard }}
          REQ: ${{ github.event.inputs.site }}
          BUDGET: ${{ github.event.inputs.budget || '330' }}
        run: |
          if [ -n "$REQ" ] && [ "$REQ" != "$SITE" ]; then echo "skip $SITE"; exit 0; fi
          echo "$SITE shard $SHARD for $BUDGET min"
          PYTHONPATH=harvest python3 harvest/runner.py --site "$SITE" --worker "$SHARD" --of 2 --budget-min "$BUDGET"
